<body>

  <!-- Input area division -->
  <div class="input-div">
    <h2>Add Notes</h2>
    <form id="noteForm">

      <div class="title-input">
        <label for="note-title">Title</label>

        <input type="text" id="note-title" name="title" placeholder="Enter your note title" required>
      </div>

      <div class="notes-input">
        <label for="note-content">Notes</label>

        <textarea id="note-content" name="content" placeholder="Write your notes here..." required></textarea>
      </div>

      <button type="submit">Save Note</button>
      <p id="save-message" class="success-message"></p>
    </form>

  </div>
  <script src="notes-page.js"></script>
